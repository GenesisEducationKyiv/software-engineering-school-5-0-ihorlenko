name: All Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v -race -coverprofile=coverage-unit.out ./internal/...

    - name: Upload unit test coverage
      uses: actions/upload-artifact@v4
      with:
        name: unit-coverage
        path: coverage-unit.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Start Docker daemon
      run: |
        sudo systemctl start docker
        sudo chmod 666 /var/run/docker.sock

    - name: Run integration tests
      run: go test -v -race -coverprofile=coverage-integration.out ./tests/integration/...
      env:
        TESTCONTAINERS_RYUK_DISABLED: false
        DOCKER_HOST: unix:///var/run/docker.sock

    - name: Upload integration test coverage
      uses: actions/upload-artifact@v4
      with:
        name: integration-coverage
        path: coverage-integration.out

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create test environment file
      run: |
        cat > .env << EOF
        POSTGRES_HOST=test-postgres
        POSTGRES_USER=test_user
        POSTGRES_PASSWORD=test_password
        POSTGRES_DB=test_weather_api
        WEATHER_API_KEY=test_api_key
        EMAIL_FROM=test@example.com
        EMAIL_PASSWORD=test_password
        EMAIL_SMTP_HOST=localhost
        EMAIL_SMTP_PORT=587
        BASE_URL=http://test-app:8080
        EOF

    - name: Run E2E tests
      run: |
        docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit e2e-tests
      env:
        COMPOSE_HTTP_TIMEOUT: 200

    - name: Extract E2E test results
      if: always()
      run: |
        mkdir -p test-results
        docker cp $(docker-compose -f docker-compose.test.yml ps -q e2e-tests):/app/test-results.json ./test-results/ 2>/dev/null || echo "No test results to copy"

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-results
        path: test-results/

    - name: Clean up Docker containers
      if: always()
      run: |
        docker-compose -f docker-compose.test.yml down -v || true

  combine-coverage:
    name: Combine Coverage Reports
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always() && (needs.unit-tests.result == 'success' || needs.integration-tests.result == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Download unit coverage
      uses: actions/download-artifact@v4
      with:
        name: unit-coverage
        path: ./
      continue-on-error: true

    - name: Download integration coverage
      uses: actions/download-artifact@v4
      with:
        name: integration-coverage  
        path: ./
      continue-on-error: true

    - name: Combine coverage reports
      run: |
        # Install gocovmerge if coverage files exist
        if [ -f "coverage-unit.out" ] || [ -f "coverage-integration.out" ]; then
          go install github.com/wadey/gocovmerge@latest
          
          # Combine coverage files that exist
          coverage_files=""
          [ -f "coverage-unit.out" ] && coverage_files="$coverage_files coverage-unit.out"
          [ -f "coverage-integration.out" ] && coverage_files="$coverage_files coverage-integration.out"
          
          if [ -n "$coverage_files" ]; then
            gocovmerge $coverage_files > coverage-combined.out
            go tool cover -html=coverage-combined.out -o coverage-combined.html
            go tool cover -func=coverage-combined.out > coverage-summary.txt
            cat coverage-summary.txt
          fi
        fi

    - name: Upload combined coverage
      uses: actions/upload-artifact@v4
      with:
        name: combined-coverage
        path: |
          coverage-combined.out
          coverage-combined.html
          coverage-summary.txt

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage-combined.out
        flags: combined
        name: combined-coverage
        fail_ci_if_error: false

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    
    steps:
    - name: Test Results Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Set overall result
        if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.integration-tests.result }}" == "success" && "${{ needs.e2e-tests.result }}" == "success" ]]; then
          echo "All tests passed!" >> $GITHUB_STEP_SUMMARY
          echo "overall_result=success" >> $GITHUB_OUTPUT
        else
          echo "Some tests failed. Please check the individual test jobs for details." >> $GITHUB_STEP_SUMMARY
          echo "overall_result=failure" >> $GITHUB_OUTPUT
        fi

    - name: Fail if any tests failed
      if: needs.unit-tests.result != 'success' || needs.integration-tests.result != 'success' || needs.e2e-tests.result != 'success'
      run: |
        echo "One or more test suites failed."
        exit 1